<!DOCTYPE html><html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e27">
<link rel="apple-touch-icon" href="/ox_icon-180.png">
<link rel="icon" type="image/png" href="/ox_icon-32.png">
<link rel="manifest" href="/manifest.json">
<title>Dashboard Login</title>
<style>
:root{--bg:#0a0e27;--card:#111640;--border:#1e2456;--text:#e2e8f0;--muted:#8892b0;--green:#22c55e;--red:#ef4444;--accent:#6366f1}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 20% 50%,rgba(99,102,241,.08),transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(34,197,94,.05),transparent 50%);pointer-events:none}
.login-box{position:relative;z-index:1;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px 28px;width:320px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.logo{margin-bottom:12px}
.logo img{width:64px;height:64px;border-radius:14px}
.login-box h2{font-size:1.2rem;font-weight:600;margin-bottom:6px;background:linear-gradient(135deg,#e2e8f0,#a5b4fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.login-box .sub{font-size:.78rem;color:var(--muted);margin-bottom:24px}
.login-box input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);font-size:.92rem;outline:none;text-align:center;letter-spacing:4px;transition:.2s}
.login-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.login-box input::placeholder{letter-spacing:0;color:var(--muted)}
.login-box button{width:100%;margin-top:16px;padding:12px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:.92rem;font-weight:500;cursor:pointer;transition:.2s}
.login-box button:active{transform:scale(.97)}
.login-box .err{margin-top:12px;font-size:.78rem;color:var(--red);min-height:20px}
</style>
</head>
<body>
<div class="login-box">
  <div class="logo"><img src="/ox_icon.png" alt="logo"></div>
  <h2>高股息看板</h2>
  <div class="sub">请输入密码以继续</div>
  <form id="loginForm" method="POST" action="/login">
    <input type="password" id="pwd" name="password" placeholder="密码" autocomplete="off" inputmode="numeric">
    <button type="submit">进 入</button>
    <div class="err" id="err"></div>
  </form>
</div>
<script>
const params = new URLSearchParams(location.search);
if (params.get('err') === '1') {
  document.getElementById('err').textContent = '密码错误，请重试';
}
document.getElementById('loginForm').addEventListener('submit', function(e) {
  var pwd = document.getElementById('pwd').value.trim();
  if (!pwd) { e.preventDefault(); document.getElementById('err').textContent = '请输入密码'; }
});
</script>
</body>
</html>
